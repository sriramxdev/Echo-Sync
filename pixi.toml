[workspace]
name = "echo-sync"
version = "0.1.0"
description = "Echo-Sync: Edge-Optimized Continuous ISL Translation Platform"
authors = [
    "Sri Ram Sharma <193415805+sriramxdev@users.noreply.github.com>",
    "Ujjawal Kesarwani <#>",
    "Yusuf Mushtaq <#>",
    "Shubhanshu Singh <#>"
]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "=3.12"
numpy = ">=1.26,<2.0"
pytest = ">=8.0"
ruff = ">=0.3"
opencv = ">=4.10,<5"
tqdm = ">=4.66"
packaging = "*"
pillow = "*"
matplotlib = "*"
websockets = ">=17.4,<18"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu132"]

[pypi-dependencies]
mediapipe = "==0.10.21"
packaging = "*"
matplotlib = "*"
torch = ">=2.4.0"
torchvision = "*"
